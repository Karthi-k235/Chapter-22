<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sil-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1F33"/>
      <stop offset="100%" stop-color="#190F1D"/>
    </linearGradient>
    <filter id="shadow-1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4A2855" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Silhouette 1: Long hair, standing pose, boots -->
  <g filter="url(#shadow-1)">
    <!-- Head & Hair -->
    <path d="M 100,50 C 82,50 78,72 80,95 C 75,100 74,130 78,160 C 80,180 82,190 85,210 L 88,210 C 85,160 86,110 92,90 C 95,85 105,85 108,90 C 114,110 115,160 112,210 L 115,210 C 118,190 120,180 122,160 C 126,130 125,100 120,95 C 122,72 118,50 100,50 Z" fill="url(#sil-grad-1)"/>
    <!-- Head shape -->
    <ellipse cx="100" cy="72" rx="14" ry="17" fill="url(#sil-grad-1)"/>
    <!-- Neck & Shoulders -->
    <path d="M 94,86 L 106,86 L 122,105 L 78,105 Z" fill="url(#sil-grad-1)"/>
    <!-- Torso & Dress/Top -->
    <path d="M 78,105 C 76,135 80,165 84,195 L 116,195 C 120,165 124,135 122,105 Z" fill="url(#sil-grad-1)"/>
    <!-- Arms -->
    <path d="M 78,105 C 70,125 68,155 72,185 C 74,188 77,185 76,180 C 73,155 75,130 82,112 Z" fill="url(#sil-grad-1)"/>
    <path d="M 122,105 C 130,125 132,155 128,185 C 126,188 123,185 124,180 C 127,155 125,130 118,112 Z" fill="url(#sil-grad-1)"/>
    <!-- Legs & Stylish Boots -->
    <path d="M 84,195 L 82,300 C 80,330 78,360 76,375 L 88,375 C 90,360 92,320 94,295 L 97,195 Z" fill="url(#sil-grad-1)"/>
    <path d="M 103,195 L 106,295 C 108,320 110,360 112,375 L 124,375 C 122,360 120,330 118,300 L 116,195 Z" fill="url(#sil-grad-1)"/>
    <!-- Feet/Boots detail -->
    <path d="M 74,360 C 70,375 66,378 64,380 L 88,380 L 88,360 Z" fill="url(#sil-grad-1)"/>
    <path d="M 112,360 L 112,380 L 136,380 C 134,378 130,375 126,360 Z" fill="url(#sil-grad-1)"/>
  </g>
  <!-- Subtle sparkle accents -->
  <path d="M 50,70 L 53,78 L 61,81 L 53,84 L 50,92 L 47,84 L 39,81 L 47,78 Z" fill="#F8C8DC" opacity="0.6"/>
  <path d="M 150,120 L 152,125 L 157,127 L 152,129 L 150,134 L 148,129 L 143,127 L 148,125 Z" fill="#F3E5AB" opacity="0.7"/>
</svg>
