<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sil-grad-8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1F33"/>
      <stop offset="100%" stop-color="#190F1D"/>
    </linearGradient>
    <filter id="shadow-8" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4A2855" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Silhouette 8: Braided ponytail / tall elegant posture -->
  <g filter="url(#shadow-8)">
    <!-- Braid braid down back -->
    <path d="M 100,50 C 115,55 125,75 120,110 C 118,135 112,160 108,180 L 100,180 C 105,150 110,120 108,95 C 106,75 98,65 92,60 Z" fill="url(#sil-grad-8)"/>
    <!-- Head -->
    <ellipse cx="98" cy="65" rx="13" ry="16" fill="url(#sil-grad-8)"/>
    <!-- Torso -->
    <path d="M 76,92 L 120,92 L 114,185 L 82,185 Z" fill="url(#sil-grad-8)"/>
    <!-- One hand on waist, one at side -->
    <path d="M 120,92 C 135,108 132,130 116,138 L 112,128 C 122,122 124,110 116,100 Z" fill="url(#sil-grad-8)"/>
    <!-- Legs -->
    <path d="M 82,185 L 83,285 L 82,375 L 94,375 L 96,285 L 97,185 Z" fill="url(#sil-grad-8)"/>
    <path d="M 103,185 L 104,285 L 105,375 L 117,375 L 116,285 L 115,185 Z" fill="url(#sil-grad-8)"/>
    <!-- Shoes -->
    <path d="M 76,360 L 74,380 L 98,380 Z" fill="url(#sil-grad-8)"/>
    <path d="M 102,360 L 104,380 L 126,380 Z" fill="url(#sil-grad-8)"/>
  </g>
  <path d="M 155,100 L 157,104 L 162,105 L 157,107 L 155,111 L 153,107 L 148,105 L 153,104 Z" fill="#F8C8DC" opacity="0.9"/>
</svg>
