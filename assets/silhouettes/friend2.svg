<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sil-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A1B2E"/>
      <stop offset="100%" stop-color="#150C17"/>
    </linearGradient>
    <filter id="shadow-2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4A2855" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Silhouette 2: Topknot Bun, hands on hips chic pose -->
  <g filter="url(#shadow-2)">
    <!-- Topknot Bun -->
    <circle cx="100" cy="45" r="12" fill="url(#sil-grad-2)"/>
    <!-- Head -->
    <ellipse cx="100" cy="68" rx="13" ry="16" fill="url(#sil-grad-2)"/>
    <!-- Neck -->
    <rect x="95" y="82" width="10" height="12" fill="url(#sil-grad-2)"/>
    <!-- Shoulders & Upper Body -->
    <path d="M 75,98 L 125,98 L 118,145 L 82,145 Z" fill="url(#sil-grad-2)"/>
    <!-- Arms on Hips (bent elbows) -->
    <path d="M 75,98 C 55,115 58,140 78,148 L 84,138 C 70,132 68,118 80,105 Z" fill="url(#sil-grad-2)"/>
    <path d="M 125,98 C 145,115 142,140 122,148 L 116,138 C 130,132 132,118 120,105 Z" fill="url(#sil-grad-2)"/>
    <!-- Fitted Pants / Legs -->
    <path d="M 82,145 L 85,260 C 86,290 85,340 84,375 L 94,375 C 96,340 97,290 97,260 L 98,145 Z" fill="url(#sil-grad-2)"/>
    <path d="M 102,145 L 103,260 C 103,290 104,340 106,375 L 116,375 C 115,340 114,290 115,260 L 118,145 Z" fill="url(#sil-grad-2)"/>
    <!-- Heels/Shoes -->
    <path d="M 78,365 C 74,375 70,378 68,380 L 94,380 L 94,365 Z" fill="url(#sil-grad-2)"/>
    <path d="M 106,365 L 106,380 L 132,380 C 130,378 126,375 122,365 Z" fill="url(#sil-grad-2)"/>
  </g>
  <!-- Sparkles -->
  <path d="M 145,60 L 147,64 L 152,65 L 147,67 L 145,71 L 143,67 L 138,65 L 143,64 Z" fill="#F8C8DC" opacity="0.8"/>
</svg>
