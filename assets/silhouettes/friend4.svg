<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sil-grad-4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1F33"/>
      <stop offset="100%" stop-color="#190F1D"/>
    </linearGradient>
    <filter id="shadow-4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4A2855" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Silhouette 4: High Ponytail, confident posture -->
  <g filter="url(#shadow-4)">
    <!-- High Ponytail swishing back -->
    <path d="M 105,52 C 125,48 145,65 150,90 C 145,95 130,85 112,68 Z" fill="url(#sil-grad-4)"/>
    <!-- Head -->
    <ellipse cx="98" cy="65" rx="13" ry="16" fill="url(#sil-grad-4)"/>
    <!-- Neck -->
    <rect x="93" y="78" width="10" height="12" fill="url(#sil-grad-4)"/>
    <!-- Torso -->
    <path d="M 76,92 L 122,92 L 115,185 L 82,185 Z" fill="url(#sil-grad-4)"/>
    <!-- Crossed arms -->
    <path d="M 76,92 C 70,110 80,135 120,125 L 118,115 C 88,122 80,105 84,95 Z" fill="url(#sil-grad-4)"/>
    <!-- Legs -->
    <path d="M 82,185 L 83,285 L 82,375 L 94,375 L 96,285 L 97,185 Z" fill="url(#sil-grad-4)"/>
    <path d="M 103,185 L 104,285 L 105,375 L 117,375 L 116,285 L 115,185 Z" fill="url(#sil-grad-4)"/>
    <!-- Boots -->
    <path d="M 76,360 L 74,380 L 98,380 Z" fill="url(#sil-grad-4)"/>
    <path d="M 102,360 L 104,380 L 126,380 Z" fill="url(#sil-grad-4)"/>
  </g>
  <path d="M 160,80 L 162,84 L 167,85 L 162,87 L 160,91 L 158,87 L 153,85 L 158,84 Z" fill="#FFE5D9" opacity="0.8"/>
</svg>
