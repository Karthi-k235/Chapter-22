<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFECEC"/>
      <stop offset="100%" stop-color="#F8C8DC"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#8E5B74" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Polaroid Frame -->
  <g filter="url(#card-shadow)">
    <rect x="15" y="15" width="270" height="330" rx="16" fill="#FFFFFF"/>
    <!-- Photo Area -->
    <rect x="30" y="30" width="240" height="230" rx="12" fill="url(#bg1)"/>
    <!-- Decorative Circle in photo -->
    <circle cx="150" cy="140" r="85" fill="#FFFDF9" opacity="0.6"/>
    <!-- Friend Avatar 1 (Ananya - High Ponytail & Coffee) -->
    <g transform="translate(0, 10)">
      <!-- Body / Outfit -->
      <path d="M 100,210 Q 150,170 200,210 L 210,260 L 90,260 Z" fill="#E88785"/>
      <!-- Neck -->
      <rect x="140" y="145" width="20" height="30" rx="6" fill="#FCD5CE"/>
      <!-- Face -->
      <ellipse cx="150" cy="125" rx="36" ry="42" fill="#FCD5CE"/>
      <!-- Eyes & Smile -->
      <circle cx="136" cy="122" r="3.5" fill="#4A2E35"/>
      <circle cx="164" cy="122" r="3.5" fill="#4A2E35"/>
      <path d="M 142,138 Q 150,146 158,138" stroke="#D96B7E" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- Cheeks -->
      <circle cx="130" cy="130" r="6" fill="#F4978E" opacity="0.5"/>
      <circle cx="170" cy="130" r="6" fill="#F4978E" opacity="0.5"/>
      <!-- High Ponytail Hair (Dark Brown) -->
      <path d="M 114,120 C 110,80 140,75 160,82 C 180,78 188,95 186,125 C 182,100 178,92 150,92 C 122,92 118,105 114,120 Z" fill="#3D261D"/>
      <path d="M 160,80 C 190,60 215,80 205,120 C 195,140 180,130 170,100 Z" fill="#3D261D"/>
      <!-- Hair tie -->
      <ellipse cx="160" cy="80" rx="7" ry="5" fill="#E88785"/>
      <!-- Iced Coffee Cup in Hand -->
      <g transform="translate(190, 160)">
        <rect x="0" y="0" width="24" height="35" rx="3" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
        <line x1="-3" y1="-5" x2="27" y2="-5" stroke="#E88785" stroke-width="3"/>
        <line x1="12" y1="-5" x2="18" y2="-20" stroke="#3D261D" stroke-width="2.5" stroke-linecap="round"/>
        <text x="12" y="22" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#D4AF37">☕</text>
      </g>
    </g>
    <!-- Label & Name -->
    <text x="150" y="292" font-family="sans-serif" font-weight="bold" font-size="20" text-anchor="middle" fill="#2A1E2D">Ananya</text>
    <text x="150" y="315" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#E88785">☕ The Iced Coffee Queen</text>
  </g>
  <!-- Sparkles -->
  <text x="35" y="55" font-size="16">✨</text>
  <text x="240" y="55" font-size="16">💖</text>
</svg>
